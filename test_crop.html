<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #fff; padding: 50px; }
    .container {
      width: 96px; height: 96px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: #eee;
      border: 4px solid #f5faff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .img-crop {
      position: absolute;
      max-width: none;
      width: 320px;
      left: -35px;
      top: -150px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="public/hall-of-fame/purvansha_rathore.jpg" class="img-crop" />
  </div>
</body>
</html>
